<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#faf5ec">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shashank Kapoor, AI Full Stack Developer</title>
<meta name="description" content="Shashank Kapoor, AI Full Stack Developer with 8+ years: AI agents, RAG, LangGraph, MCP, Python/FastAPI, React/Angular, Docker, Kubernetes and AWS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&family=Figtree:wght@400..800&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf5ec;
  --surface: #fffdf8;
  --ink: #211c18;
  --muted: #6b625a;
  --line: #e7ddcf;
  --edge: #d3c5b1;
  --accent: #ff5b35;
  --accent-ink: #ffffff;
  --sun: #ffc53d;
  --sky: #4a7fd6;
  --sk: #efe6d8;
  --k-ai: #ff5b35;
  --k-fe: #211c18;
  --k-be: #4a7fd6;
  --k-tl: #d99a00;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-lg: 7px 7px 0 var(--ink);
  --radius: 16px;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --hand: "Caveat", "Comic Sans MS", cursive;
  --blend: multiply;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1714; --surface: #24201c; --ink: #f5eee4; --muted: #b3a898; --line: #3a332c; --edge: #4d443a;
    --accent: #ff7a55; --accent-ink: #1a1714; --sun: #ffcf5c; --sky: #7aa5ef; --sk: #2a2520;
    --k-ai: #ff7a55; --k-fe: #f5eee4; --k-be: #7aa5ef; --k-tl: #ffc53d;
    --blend: screen;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 84px); scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 22px 22px; }
#root { position: relative; z-index: 1; }
p, h1, h2, h3, ul, ol { margin: 0; }
a { color: var(--accent); }
a:hover { color: var(--ink); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding-inline: clamp(1.1rem, 4vw, 2.5rem); }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 1rem; top: 1rem; z-index: 50; background: var(--surface); padding: .6rem 1rem; }
.hand { font-family: var(--hand); font-weight: 600; }

/* Cursor blob */
.blob { position: fixed; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--accent); opacity: .35; mix-blend-mode: var(--blend); pointer-events: none; z-index: 90; transition: width .25s ease, height .25s ease, margin .25s ease, opacity .25s ease; will-change: transform; }
.blob.big { width: 64px; height: 64px; margin: -32px 0 0 -32px; opacity: .22; }
.blob.hide { opacity: 0; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 2px solid var(--ink); }
.topbar-inner { display: flex; align-items: center; gap: 1.5rem; min-height: 66px; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 1.35rem; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; font-style: italic; }
.wordmark b { color: var(--accent); }
.nav { display: flex; gap: .25rem; margin-left: auto; }
.nav a { color: var(--ink); text-decoration: none; padding: .55rem .8rem; min-height: 44px; display: inline-flex; align-items: center; font-weight: 600; border-radius: 999px; }
.nav a:hover { background: var(--sun); color: #211c18; }
@media (max-width: 600px) { .nav { display: none; } .topbar-inner .btn-small { margin-left: auto; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 50px; padding: 0 1.4rem; border-radius: 999px; font: 700 1rem/1 var(--body); text-decoration: none; cursor: pointer; border: 2px solid var(--ink); box-shadow: var(--shadow); transition: box-shadow .2s ease, background .2s ease; will-change: transform; }
.btn:hover { box-shadow: var(--shadow-lg); }
.btn:active { box-shadow: 1px 1px 0 var(--ink); }
.btn-small { min-height: 44px; padding: 0 1.1rem; font-size: .95rem; box-shadow: 3px 3px 0 var(--ink); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { color: var(--accent-ink); }
.btn-ghost { background: var(--surface); color: var(--ink); }
.btn-ghost:hover { background: var(--sun); color: #211c18; }
.cta-row { display: flex; flex-wrap: wrap; gap: .9rem; }
.magnetic { transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease, background .2s ease; }

/* Bouncy letters */
.bouncy .word { display: inline-block; white-space: nowrap; }
.bouncy .ch { display: inline-block; transform-origin: 50% 90%; }
html:not(.is-ready) .rise .ch { opacity: 0; transform: translateY(.5em); }
html.is-ready .rise .ch { animation: rise .7s cubic-bezier(.2,.9,.25,1.25) both; animation-delay: calc(var(--i) * 38ms + 80ms); }
.bouncy .ch.boing { animation: boing .55s cubic-bezier(.3,.7,.3,1.4) both !important; color: var(--accent); }
@keyframes rise { from { opacity: 0; transform: translateY(.55em) rotate(6deg); } to { opacity: 1; transform: none; } }
@keyframes boing { 0% { transform: none; } 30% { transform: translateY(-.2em) rotate(-8deg) scale(1.08); } 60% { transform: translateY(.05em) rotate(3deg); } 100% { transform: none; } }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(2rem, 5vw, 4rem); padding-top: clamp(2.5rem, 6vw, 4.5rem); padding-bottom: clamp(2.5rem, 5vw, 4rem); align-items: start; }
@media (max-width: 980px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-copy { display: flex; flex-direction: column; gap: 1.35rem; position: relative; }
.hello { font: 600 1.25rem/1.2 var(--body); display: flex; align-items: center; gap: .5rem; }
.wave { display: inline-block; transform-origin: 70% 75%; animation: wave 2.4s ease-in-out 1s infinite; font-size: 1.5rem; }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(10deg); } }
.name { font-family: var(--display); font-weight: 800; font-size: clamp(3.4rem, 8.4vw, 6.6rem); line-height: .92; letter-spacing: -0.035em; cursor: default; }
.role { font-family: var(--display); font-weight: 500; font-size: clamp(1.45rem, 2.6vw, 1.95rem); line-height: 1.2; letter-spacing: -0.01em; }
.rotator { display: inline-block; color: var(--accent); font-style: italic; font-weight: 700; position: relative; }
.rotator::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.08em; height: .14em; background: var(--sun); z-index: -1; border-radius: 4px; transform: skewX(-12deg); }
.rot-word { display: inline-block; animation: flip .5s cubic-bezier(.2,.8,.2,1.2) both; }
@keyframes flip { from { opacity: 0; transform: translateY(.6em) rotate(-4deg); } to { opacity: 1; transform: none; } }
.sub { color: var(--muted); font-size: 1.05rem; }

/* 8+ years sticker */
.name-l2 { white-space: nowrap; }
.years { --s: clamp(92px, 10.5vw, 128px); position: relative; display: inline-grid; place-items: center; width: var(--s); height: var(--s); vertical-align: middle; margin-left: .12em; margin-top: -.2em; font-size: 1rem; letter-spacing: normal; cursor: default; }
.years-disc { position: absolute; inset: calc(var(--s) * .12); border-radius: 50%; background: var(--sun); border: 2px solid #211c18; box-shadow: 3px 3px 0 #211c18; display: grid; place-items: center; text-align: center; color: #211c18; transform: rotate(-8deg); transition: transform .3s cubic-bezier(.3,.7,.3,1.4); }
.years:hover .years-disc { transform: rotate(6deg) scale(1.08); }
.years-num { font: 800 calc(var(--s) * .3)/1 var(--display); letter-spacing: -0.04em; }
.years-num sup { font-size: .55em; vertical-align: .6em; margin-left: .02em; }
.years-lbl { font: 800 calc(var(--s) * .072)/1.1 var(--body); text-transform: uppercase; letter-spacing: .08em; margin-top: .15em; }
.years-ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 18s linear infinite; }
.years-ring text { font: 700 9px var(--body); text-transform: uppercase; fill: var(--ink); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Handwritten note */
.note { display: flex; align-items: flex-end; gap: .25rem; color: var(--accent); font-family: var(--hand); font-weight: 600; font-size: 1.45rem; line-height: 1.1; transform: rotate(-2deg); margin: -.25rem 0 -.6rem .25rem; }
.note svg { width: 64px; height: 38px; flex: none; overflow: visible; }
.note path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 140; stroke-dashoffset: 140; }
html.is-ready .note path { animation: draw 1.1s ease .9s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* Stickers */
.lede-hl { display: flex; flex-direction: column; gap: 1rem; }
.hl-label { font: 700 .8rem/1 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .6rem; }
.hl-tags { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
.hl-tags li { font-weight: 700; font-size: .95rem; line-height: 1.2; padding: .45rem .85rem; border-radius: 999px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); transform: rotate(var(--r, 0deg)); transition: transform .25s cubic-bezier(.3,.7,.3,1.4), box-shadow .2s; box-shadow: 2px 2px 0 var(--ink); cursor: default; }
.hl-tags li:hover { transform: rotate(0) translateY(-3px) scale(1.06); box-shadow: 4px 4px 0 var(--ink); }
.hl-ai li { background: var(--accent); color: var(--accent-ink); }

/* Skill space card */
.space { background: var(--surface); border: 2px solid var(--ink); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow-lg); }
.space-head { padding: 1.5rem 1.5rem 0; display: flex; flex-direction: column; gap: .4rem; }
.space-kicker { font-family: var(--hand); font-size: 1.35rem; color: var(--accent); line-height: 1; transform: rotate(-1.5deg); transform-origin: left; }
.space-title { font-family: var(--display); font-weight: 700; font-size: clamp(1.4rem, 2.4vw, 1.85rem); letter-spacing: -0.02em; line-height: 1.15; }
.space-sub { color: var(--muted); font-size: .98rem; max-width: 40rem; }
.space-stage { position: relative; height: clamp(340px, 44vw, 460px); margin-top: .5rem; overflow: hidden; }
.space-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
.space-gl:active { cursor: grabbing; }
.space-labels { position: absolute; inset: 0; pointer-events: none; }
.space-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 2rem; text-align: center; color: var(--muted); }
.node-label, .cluster-label { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform, opacity; }
.node-label { font: 700 .8rem/1 var(--body); background: var(--surface); color: var(--ink); border: 2px solid var(--c); padding: .32rem .6rem; border-radius: 999px; opacity: 0; }
.cluster-label { font: 700 1rem/1 var(--display); font-style: italic; letter-spacing: -0.01em; color: var(--ink); }
.cluster-label.c-ai { color: var(--accent); }
.c-ai { --c: var(--k-ai); }
.c-fe { --c: var(--k-fe); }
.c-be { --c: var(--k-be); }
.c-tl { --c: var(--k-tl); }
.space-query { padding: 1.25rem 1.5rem 0; display: flex; flex-direction: column; gap: .75rem; border-top: 2px dashed var(--edge); }
.q-label { font-weight: 700; font-size: .95rem; }
#skill-q { width: 100%; min-height: 52px; padding: 0 1.1rem; border-radius: 999px; border: 2px solid var(--ink); background: var(--bg); color: var(--ink); font: 600 1.05rem var(--body); }
#skill-q::placeholder { color: var(--muted); font-weight: 500; }
#skill-q:focus-visible { border-color: var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { min-height: 44px; padding: 0 1rem; border-radius: 999px; border: 2px solid var(--ink); background: transparent; color: var(--ink); font: 700 .92rem var(--body); cursor: pointer; transition: transform .2s cubic-bezier(.3,.7,.3,1.4), background .2s; }
.chip:hover { transform: translateY(-2px) rotate(-1deg); background: var(--sun); color: #211c18; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.results { padding: 1.25rem 1.5rem 1.5rem; }
.empty { color: var(--muted); }
.result-list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .25rem 1.5rem; }
@media (max-width: 640px) { .result-list { grid-template-columns: minmax(0, 1fr); } }
.result { display: flex; gap: .75rem; padding: .7rem 0; border-bottom: 1px solid var(--line); animation: pop .35s cubic-bezier(.2,.8,.2,1.2) both; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
.dot { width: .75rem; height: .75rem; background: var(--c); flex: none; margin-top: .45rem; display: inline-block; }
.dot.c-ai { border-radius: 50%; }
.dot.c-be { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.dot.c-tl { transform: rotate(45deg) scale(.82); }
.r-name { font-weight: 800; display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem; }
.r-cluster { font-weight: 500; font-size: .82rem; color: var(--muted); }
.r-desc { color: var(--muted); font-size: .95rem; line-height: 1.5; }
.r-where { font-size: .88rem; font-weight: 700; margin-top: .2rem; }

/* Now + roles */
.now-row { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(1.25rem, 3vw, 2rem); padding-bottom: 1rem; }
@media (max-width: 860px) { .now-row { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(1.25rem, 3vw, 1.75rem); transition: transform .3s cubic-bezier(.3,.7,.3,1.3), box-shadow .3s; }
.card:hover { transform: translate(-2px, -2px) rotate(var(--tilt, -.4deg)); box-shadow: var(--shadow-lg); }
.card-kicker { display: inline-flex; align-items: center; gap: .5rem; font: 800 .8rem/1 var(--body); letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: .4rem .7rem; border-radius: 999px; margin-bottom: 1rem; }
.live-dot { width: .55rem; height: .55rem; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }
.now-list { list-style: none; padding: 0; display: flex; flex-direction: column; }
.now-list li { display: grid; grid-template-columns: 2rem 7.5rem minmax(0, 1fr); gap: .5rem; align-items: baseline; padding: .7rem 0; border-bottom: 2px dashed var(--line); }
.now-list li:last-child { border-bottom: 0; }
@media (max-width: 520px) { .now-list li { grid-template-columns: 1.8rem minmax(0, 1fr); } .now-list .now-v { grid-column: 2; } }
.now-ico { font-size: 1.2rem; }
.now-k { font-family: var(--hand); font-size: 1.35rem; color: var(--accent); line-height: 1; }
.now-v { font-weight: 600; }
.clock { font-variant-numeric: tabular-nums; font-weight: 800; }
.clock .colon { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.roles-card { --tilt: .5deg; background: var(--sun); color: #211c18; }
.roles-card .card-kicker { background: #211c18; color: var(--sun); }
.role-list { list-style: none; padding: 0; counter-reset: r; }
.role-list li { counter-increment: r; display: flex; align-items: baseline; gap: .75rem; padding: .55rem 0; border-bottom: 2px solid rgba(33,28,24,.15); font: 700 1.1rem/1.3 var(--body); }
.role-list li:last-child { border-bottom: 0; }
.role-list li::before { content: counter(r, decimal-leading-zero); font: 800 .85rem var(--display); font-style: italic; opacity: .6; }
.role-list li:first-child { font-family: var(--display); font-size: 1.35rem; }

/* Marquee */
.marquee { margin-top: clamp(2.5rem, 6vw, 4.5rem); transform: rotate(-1.8deg); background: var(--accent); color: var(--accent-ink); border-block: 2px solid var(--ink); overflow: hidden; }
.marquee-track { display: flex; width: max-content; animation: marq 38s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee span { font: 800 clamp(1.2rem, 2.6vw, 1.7rem)/1 var(--display); font-style: italic; padding: 1rem 0; white-space: nowrap; }
.marquee span::after { content: "✦"; font-style: normal; margin: 0 1.25rem; color: var(--sun); }
@keyframes marq { to { transform: translateX(-50%); } }

/* Sections */
.section { padding-top: clamp(3.5rem, 8vw, 6rem); padding-bottom: clamp(1rem, 3vw, 2rem); }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1.25rem; margin-bottom: 2rem; }
.section-title { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 4.6vw, 3.4rem); letter-spacing: -0.035em; line-height: 1; }
.section-aside { font-family: var(--hand); font-size: 1.5rem; color: var(--accent); transform: rotate(-2deg); line-height: 1; }

/* Reveal on scroll */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  .wave, .years-ring, .marquee-track, .live-dot, .clock .colon { animation: none; }
  html.is-ready .rise .ch, .bouncy .ch.boing, .rot-word, .result { animation: none !important; opacity: 1; transform: none; }
  html.is-ready .note path { animation: none; stroke-dashoffset: 0; }
  .card:hover, .hl-tags li:hover, .chip:hover { transform: none; }
}

/* Work */
.timeline { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 1.75rem; }
.job { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: clamp(1rem, 4vw, 2.5rem); }
.job:nth-child(even) { --tilt: .4deg; }
@media (max-width: 760px) { .job { grid-template-columns: minmax(0, 1fr); gap: .75rem; } }
.job-meta { display: flex; flex-direction: column; gap: .25rem; }
.job-when { display: inline-block; align-self: flex-start; font: 800 .82rem/1 var(--body); letter-spacing: .04em; text-transform: uppercase; background: var(--sun); color: #211c18; padding: .4rem .65rem; border-radius: 999px; border: 2px solid #211c18; }
.job-company { font-family: var(--display); font-weight: 800; font-size: 1.45rem; letter-spacing: -0.015em; margin-top: .5rem; }
.job-team { color: var(--muted); font-size: .95rem; }
.job-body { display: flex; flex-direction: column; gap: .9rem; max-width: 48rem; }
.job-role { font-family: var(--display); font-weight: 700; font-size: clamp(1.4rem, 2.6vw, 1.85rem); letter-spacing: -0.02em; line-height: 1.15; }
.job-title { color: var(--muted); margin-top: -.5rem; font-weight: 600; }
.feature { border: 2px solid var(--ink); border-radius: 14px; padding: 1rem 1.2rem; background: var(--accent); color: var(--accent-ink); transform: rotate(-.8deg); box-shadow: 3px 3px 0 var(--ink); }
.feature-name { font-family: var(--display); font-weight: 800; font-size: 1.25rem; display: flex; align-items: center; gap: .5rem; }
.job-points { padding-left: 1.2rem; color: var(--muted); display: flex; flex-direction: column; gap: .35rem; }
.job-points li::marker { color: var(--accent); }
.tags { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
.tags li { border: 2px solid var(--edge); border-radius: 999px; padding: .2rem .65rem; font-size: .86rem; font-weight: 700; }
.award { font-weight: 700; font-size: .95rem; }
.award::before { content: "🏆 "; }

/* Skills */
.skill-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem; align-items: start; }
@media (max-width: 1080px) { .skill-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .skill-grid { grid-template-columns: minmax(0, 1fr); } }
.skill-col { padding: 1.25rem 1.25rem .5rem; }
.skill-col:nth-child(2) { --tilt: .5deg; }
.skill-col:nth-child(3) { --tilt: -.5deg; }
.skill-col:nth-child(4) { --tilt: .4deg; }
.skill-head { display: flex; align-items: center; gap: .55rem; font-family: var(--display); font-size: 1.2rem; font-weight: 800; padding-bottom: .75rem; border-bottom: 2px solid var(--ink); margin-bottom: .25rem; line-height: 1.2; }
.skill-head .dot { margin-top: 0; }
.skill-list { list-style: none; padding: 0; }
.skill-list li { padding: .65rem 0; border-bottom: 2px dashed var(--line); display: flex; flex-direction: column; }
.skill-list li:last-child { border-bottom: 0; }
.skill-list strong { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; font-weight: 800; }
.skill-list span { color: var(--muted); font-size: .92rem; line-height: 1.45; }
.key-badge { font-style: normal; color: var(--accent); font-size: 1rem; line-height: 1; }

/* Education */
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
@media (max-width: 760px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
.two-col .section-title { font-size: clamp(1.8rem, 3.5vw, 2.4rem); margin-bottom: 1rem; }
.edu-degree { font-weight: 800; font-size: 1.15rem; }
.edu-meta { color: var(--muted); }
.plain-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: .75rem; }

/* Contact */
.contact { margin-top: clamp(3.5rem, 8vw, 6rem); background: var(--ink); color: var(--bg); padding: clamp(3.5rem, 9vw, 7rem) 0; border-top: 2px solid var(--ink); position: relative; overflow: hidden; }
.contact-inner { display: flex; flex-direction: column; gap: 1.5rem; position: relative; }
.contact-title { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 5.2rem); letter-spacing: -0.04em; line-height: .95; max-width: 14ch; cursor: default; }
.contact-title .bouncy .ch.boing { color: var(--sun); }
.contact-time { font-family: var(--hand); font-size: clamp(1.4rem, 3vw, 1.8rem); color: var(--sun); transform: rotate(-1.5deg); transform-origin: left; }
.contact-email { font-family: var(--display); font-weight: 700; font-style: italic; font-size: clamp(1.2rem, 3.2vw, 2rem); color: var(--bg); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: .2em; text-decoration-thickness: 3px; overflow-wrap: anywhere; align-self: flex-start; }
.contact-email:hover { color: var(--sun); }
.contact .btn { border-color: var(--bg); box-shadow: 4px 4px 0 var(--accent); }
.contact .btn:hover { box-shadow: 7px 7px 0 var(--accent); }
.contact .btn-primary { background: var(--bg); color: var(--ink); }
.contact .btn-primary:hover { color: var(--ink); background: var(--sun); }
.contact .btn-ghost { background: transparent; color: var(--bg); }
.contact .btn-ghost:hover { background: var(--bg); color: var(--ink); }
.contact :focus-visible { outline-color: var(--sun); }
.contact-note { color: var(--bg); opacity: .8; }
.contact-doodle { position: absolute; right: -40px; top: -60px; width: 260px; height: 260px; border-radius: 50%; border: 2px dashed var(--accent); opacity: .5; animation: spin 40s linear infinite; }
@media (prefers-reduced-motion: reduce) { .contact-doodle { animation: none; } }

.footer { padding-top: 1.5rem; padding-bottom: 2rem; color: var(--muted); font-size: .9rem; display: flex; flex-direction: column; gap: .75rem; }
.legal { display: flex; flex-direction: column; gap: .25rem; max-width: 46rem; }
.legal summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; color: var(--ink); }
.legal p { padding-bottom: .75rem; }

/* Skeleton */
.space-stage.is-loading::before { content: ""; position: absolute; inset: 1.5rem; background: var(--sk); border-radius: 14px; animation: sk-pulse 1.4s ease-in-out infinite; }
.sk { min-height: 100vh; }
.sk-bar { height: 66px; border-bottom: 2px solid var(--line); }
.sk-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(2rem, 5vw, 4rem); padding-top: clamp(2.5rem, 6vw, 5rem); }
@media (max-width: 980px) { .sk-hero { grid-template-columns: minmax(0, 1fr); } }
.sk-col { display: flex; flex-direction: column; gap: 1rem; }
.sk-line, .sk-panel { background: var(--sk); border-radius: 8px; animation: sk-pulse 1.4s ease-in-out infinite; }
.sk-line { height: 1rem; }
.sk-line.h-xl { height: clamp(3rem, 7vw, 5.4rem); }
.sk-panel { height: clamp(420px, 60vw, 640px); border-radius: 22px; }
.w40 { width: 40%; } .w50 { width: 50%; } .w60 { width: 60%; } .w80 { width: 80%; } .w90 { width: 90%; }
@keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .sk-line, .sk-panel, .space-stage.is-loading::before { animation: none; } }

#boot { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 2rem; transition: opacity .5s ease, visibility .5s; }
#boot.done { opacity: 0; visibility: hidden; }
.boot-inner { width: min(34rem, 100%); display: flex; flex-direction: column; gap: 1.5rem; }
.boot-name { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1; letter-spacing: -0.035em; color: var(--ink); min-height: 1em; }
.boot-cursor { display: inline-block; width: .08em; height: .85em; margin-left: .06em; background: var(--accent); vertical-align: -0.05em; animation: boot-blink 1s steps(1) infinite; }
.boot-term { font: 500 .92rem/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); list-style: none; padding: 0; margin: 0; min-height: 6.8em; }
.boot-term li { opacity: 0; transform: translateY(4px); transition: opacity .25s ease, transform .25s ease; }
.boot-term li.on { opacity: 1; transform: none; }
.boot-term .ok { color: var(--accent); font-weight: 700; margin-left: .4em; opacity: 0; transition: opacity .2s; }
.boot-term li.ok-on .ok { opacity: 1; }
.boot-term .p { color: var(--accent); margin-right: .5em; }
@keyframes boot-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .boot-cursor { animation: none; } .boot-term li, #boot { transition: none; } }
