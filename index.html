<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f8f6f2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shashank Kapoor, AI Full Stack Developer</title>
<meta name="description" content="Shashank Kapoor, AI Full Stack Developer with 8+ years: AI agents, RAG, LangGraph, MCP, Python/FastAPI, React/Angular, Docker, Kubernetes and AWS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&family=Figtree:wght@400..800&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f6f2;
  --surface: #ffffff;
  --ink: #1c1b19;
  --muted: #5f5b55;
  --line: #e6e2da;
  --edge: #d3cdc2;
  --accent: #b9472a;
  --accent-ink: #ffffff;
  --tint: #f7ebe5;
  --sk: #eeeae3;
  --k-ai: #b9472a;
  --k-fe: #1c1b19;
  --k-be: #3d6fb5;
  --k-tl: #a87b10;
  --shadow: 0 1px 2px rgba(28,27,25,.05), 0 10px 30px -18px rgba(28,27,25,.25);
  --shadow-lg: 0 2px 4px rgba(28,27,25,.06), 0 18px 40px -20px rgba(28,27,25,.35);
  --radius: 14px;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --surface: #1f1e1c; --ink: #f1ede6; --muted: #aaa49a; --line: #34312d; --edge: #47433d;
    --accent: #e8795a; --accent-ink: #161514; --tint: #2b211d; --sk: #262421;
    --k-ai: #e8795a; --k-fe: #f1ede6; --k-be: #7aa5ef; --k-tl: #d9b04a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.6);
    --shadow-lg: 0 2px 4px rgba(0,0,0,.35), 0 18px 40px -20px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 84px); scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
p, h1, h2, h3, ul, ol, dl, dd { margin: 0; }
a { color: var(--accent); }
a:hover { color: var(--ink); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1220px; margin: 0 auto; padding-inline: clamp(1.1rem, 4vw, 2.5rem); }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 1rem; top: 1rem; z-index: 50; background: var(--surface); padding: .6rem 1rem; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); border-bottom: 1px solid var(--line); }
.topbar-inner { display: flex; align-items: center; gap: 1.5rem; min-height: 64px; }
.wordmark { font-family: var(--display); font-weight: 700; font-size: 1.2rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.wordmark b { color: var(--accent); }
.nav { display: flex; gap: .25rem; margin-left: auto; }
.nav a { color: var(--muted); text-decoration: none; padding: .55rem .8rem; min-height: 44px; display: inline-flex; align-items: center; font-weight: 600; font-size: .98rem; }
.nav a:hover { color: var(--ink); }
@media (max-width: 600px) { .nav { display: none; } .topbar-inner .btn-small { margin-left: auto; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 48px; padding: 0 1.3rem; border-radius: 10px; font: 600 1rem/1 var(--body); text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease; }
.btn:hover { transform: translateY(-1px); }
.btn-small { min-height: 42px; padding: 0 1rem; font-size: .95rem; }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--edge); }
.btn-ghost:hover { border-color: var(--ink); color: var(--ink); }
.cta-row { display: flex; flex-wrap: wrap; gap: .75rem; }

/* Name: letters rise in once after the loader */
.bouncy .word { display: inline-block; white-space: nowrap; }
.bouncy .ch { display: inline-block; }
html:not(.is-ready) .rise .ch { opacity: 0; transform: translateY(.35em); }
html.is-ready .rise .ch { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 28ms + 60ms); }
html.is-ready .rise .ch.risen { animation: none; opacity: 1; transform: none; }
@keyframes rise { from { opacity: 0; transform: translateY(.35em); } to { opacity: 1; transform: none; } }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(2rem, 5vw, 4rem); padding-top: clamp(2.5rem, 6vw, 4.5rem); padding-bottom: clamp(2.5rem, 5vw, 4rem); align-items: start; }
@media (max-width: 980px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-copy { display: flex; flex-direction: column; gap: 1.3rem; }
.hello { font: 600 .9rem/1 var(--body); color: var(--accent); text-transform: uppercase; letter-spacing: .12em; }
.name { font-family: var(--display); font-weight: 700; font-size: clamp(3.2rem, 7.6vw, 6rem); line-height: .95; letter-spacing: -0.03em; margin-top: .35rem; }
.role { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 2.5vw, 1.85rem); line-height: 1.25; letter-spacing: -0.01em; }
.rotator { display: inline-block; color: var(--accent); font-style: italic; font-weight: 600; }
.rot-word { display: inline-block; animation: fade-up .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes fade-up { from { opacity: 0; transform: translateY(.35em); } to { opacity: 1; transform: none; } }
.sub { color: var(--muted); font-size: 1.05rem; }
.sub strong { color: var(--ink); }

/* Stats (8+ years) */
.stats { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 1rem 1.4rem 1rem 0; margin-right: 1.4rem; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: .25rem; }
.stat:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
.stat dt { font: 700 clamp(2rem, 4vw, 2.6rem)/1 var(--display); letter-spacing: -0.03em; color: var(--ink); }
.stat:first-child dt { color: var(--accent); }
.stat dd { font-size: .86rem; color: var(--muted); line-height: 1.35; max-width: 14ch; }
.stat-wide dt { font-size: clamp(1.25rem, 2.4vw, 1.5rem); padding-top: .35rem; }
.stat-wide dd { max-width: none; }
@media (max-width: 460px) { .stats { grid-template-columns: auto minmax(0, 1fr); } .stat-wide { grid-column: 1 / -1; border-top: 1px solid var(--line); border-right: 0; margin-right: 0; } .stat:nth-child(2) { border-right: 0; margin-right: 0; } }

/* Tags */
.lede-hl { display: flex; flex-direction: column; gap: 1rem; }
.hl-label { font: 600 .78rem/1 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: .6rem; }
.hl-tags { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .45rem; }
.hl-tags li { font-weight: 600; font-size: .92rem; line-height: 1.2; padding: .42rem .75rem; border-radius: 8px; border: 1px solid var(--edge); background: var(--surface); color: var(--ink); transition: border-color .2s, transform .2s; }
.hl-tags li:hover { border-color: var(--ink); transform: translateY(-1px); }
.hl-ai li { background: var(--tint); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.hl-ai li:hover { border-color: var(--accent); }

/* Skill space card */
.space { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
.space-head { padding: 1.5rem 1.5rem 0; display: flex; flex-direction: column; gap: .4rem; }
.space-kicker { font: 600 .78rem/1 var(--body); color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
.space-title { font-family: var(--display); font-weight: 600; font-size: clamp(1.35rem, 2.3vw, 1.7rem); letter-spacing: -0.015em; line-height: 1.2; }
.space-sub { color: var(--muted); font-size: .97rem; max-width: 40rem; }
.space-stage { position: relative; height: clamp(340px, 44vw, 460px); margin-top: .5rem; overflow: hidden; }
.space-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
.space-gl:active { cursor: grabbing; }
.space-labels { position: absolute; inset: 0; pointer-events: none; }
.space-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 2rem; text-align: center; color: var(--muted); }
.node-label, .cluster-label { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform, opacity; }
.node-label { font: 600 .78rem/1 var(--body); background: var(--surface); color: var(--ink); border: 1.5px solid var(--c); padding: .3rem .55rem; border-radius: 6px; opacity: 0; }
.cluster-label { font: 600 .95rem/1 var(--display); letter-spacing: -0.01em; color: var(--muted); }
.cluster-label.c-ai { color: var(--accent); }
.c-ai { --c: var(--k-ai); }
.c-fe { --c: var(--k-fe); }
.c-be { --c: var(--k-be); }
.c-tl { --c: var(--k-tl); }
.space-query { padding: 1.25rem 1.5rem 0; display: flex; flex-direction: column; gap: .75rem; border-top: 1px solid var(--line); }
.q-label { font-weight: 600; font-size: .92rem; }
#skill-q { width: 100%; min-height: 50px; padding: 0 1rem; border-radius: 10px; border: 1px solid var(--edge); background: var(--bg); color: var(--ink); font: 500 1.02rem var(--body); }
#skill-q::placeholder { color: var(--muted); }
#skill-q:focus-visible { border-color: var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { min-height: 42px; padding: 0 .95rem; border-radius: 8px; border: 1px solid var(--edge); background: transparent; color: var(--ink); font: 600 .9rem var(--body); cursor: pointer; transition: border-color .2s, background .2s; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.results { padding: 1.25rem 1.5rem 1.5rem; }
.empty { color: var(--muted); }
.result-list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .25rem 1.5rem; }
@media (max-width: 640px) { .result-list { grid-template-columns: minmax(0, 1fr); } }
.result { display: flex; gap: .75rem; padding: .7rem 0; border-bottom: 1px solid var(--line); animation: fade-up .3s ease both; }
.dot { width: .7rem; height: .7rem; background: var(--c); flex: none; margin-top: .45rem; display: inline-block; }
.dot.c-ai { border-radius: 50%; }
.dot.c-be { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.dot.c-tl { transform: rotate(45deg) scale(.82); }
.r-name { font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem; }
.r-cluster { font-weight: 500; font-size: .82rem; color: var(--muted); }
.r-desc { color: var(--muted); font-size: .95rem; line-height: 1.5; }
.r-where { font-size: .88rem; font-weight: 600; margin-top: .2rem; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(1.25rem, 3vw, 1.75rem); transition: box-shadow .3s ease, transform .3s ease; }
.card:hover { box-shadow: var(--shadow-lg); }
.card-kicker { display: inline-flex; align-items: center; gap: .5rem; font: 600 .78rem/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }

/* Now + roles */
.now-row { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(1.25rem, 3vw, 1.75rem); }
@media (max-width: 860px) { .now-row { grid-template-columns: minmax(0, 1fr); } }
.live-dot { width: .5rem; height: .5rem; border-radius: 50%; background: #2fa66a; box-shadow: 0 0 0 0 rgba(47,166,106,.5); animation: pulse 2s ease-out infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(47,166,106,0); } 100% { box-shadow: 0 0 0 0 rgba(47,166,106,0); } }
.now-list { list-style: none; padding: 0; display: flex; flex-direction: column; }
.now-list li { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: 1rem; align-items: baseline; padding: .75rem 0; border-bottom: 1px solid var(--line); }
.now-list li:last-child { border-bottom: 0; padding-bottom: 0; }
@media (max-width: 520px) { .now-list li { grid-template-columns: minmax(0, 1fr); gap: .15rem; } }
.now-k { font: 600 .8rem/1.4 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.now-v { font-weight: 500; }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; }
.clock .colon { animation: blink 2s steps(1) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.roles-card { border-top: 3px solid var(--accent); }
.role-list { list-style: none; padding: 0; counter-reset: r; }
.role-list li { counter-increment: r; display: flex; align-items: baseline; gap: .85rem; padding: .6rem 0; border-bottom: 1px solid var(--line); font: 600 1.05rem/1.3 var(--body); }
.role-list li:last-child { border-bottom: 0; padding-bottom: 0; }
.role-list li::before { content: counter(r, decimal-leading-zero); font: 600 .8rem var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.role-list li:first-child { font-family: var(--display); font-size: 1.3rem; color: var(--accent); }

/* Sections */
.section { padding-top: clamp(3.5rem, 8vw, 6rem); padding-bottom: clamp(1rem, 3vw, 2rem); }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1.25rem; margin-bottom: 1.75rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
.section-title { font-family: var(--display); font-weight: 600; font-size: clamp(2rem, 4vw, 2.9rem); letter-spacing: -0.025em; line-height: 1; }
.section-aside { color: var(--muted); font-size: .95rem; font-weight: 500; }
.section-aside strong { color: var(--accent); }

/* Reveal on scroll */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  .live-dot, .clock .colon { animation: none; }
  html.is-ready .rise .ch, .rot-word, .result { animation: none !important; opacity: 1; transform: none; }
  .btn:hover, .hl-tags li:hover { transform: none; }
}

/* Work */
.timeline { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 1.25rem; }
.job { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: clamp(1rem, 4vw, 2.5rem); }
@media (max-width: 760px) { .job { grid-template-columns: minmax(0, 1fr); gap: .75rem; } }
.job-meta { display: flex; flex-direction: column; gap: .25rem; }
.job-when { font: 600 .82rem/1.3 var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.job-company { font-family: var(--display); font-weight: 600; font-size: 1.35rem; letter-spacing: -0.01em; margin-top: .25rem; }
.job-team { color: var(--muted); font-size: .92rem; }
.job-body { display: flex; flex-direction: column; gap: .85rem; max-width: 48rem; }
.job-role { font-family: var(--display); font-weight: 600; font-size: clamp(1.35rem, 2.4vw, 1.7rem); letter-spacing: -0.015em; line-height: 1.2; }
.job-title { color: var(--muted); margin-top: -.45rem; font-weight: 500; }
.feature { border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: .9rem 1.1rem; background: var(--tint); }
.feature-name { font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--accent); }
.job-points { padding-left: 1.2rem; color: var(--muted); display: flex; flex-direction: column; gap: .35rem; }
.job-points li::marker { color: var(--accent); }
.tags { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
.tags li { border: 1px solid var(--edge); border-radius: 6px; padding: .18rem .55rem; font-size: .85rem; font-weight: 600; color: var(--muted); }
.award { font-weight: 600; font-size: .93rem; }

/* Skills */
.skill-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.25rem; align-items: start; }
@media (max-width: 1080px) { .skill-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .skill-grid { grid-template-columns: minmax(0, 1fr); } }
.skill-col { padding: 1.25rem 1.25rem .5rem; }
.skill-head { display: flex; align-items: center; gap: .55rem; font-family: var(--display); font-size: 1.12rem; font-weight: 600; padding-bottom: .75rem; border-bottom: 1px solid var(--line); margin-bottom: .25rem; line-height: 1.25; }
.skill-head .dot { margin-top: 0; }
.skill-list { list-style: none; padding: 0; }
.skill-list li { padding: .62rem 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; }
.skill-list li:last-child { border-bottom: 0; }
.skill-list strong { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; font-weight: 700; }
.skill-list span { color: var(--muted); font-size: .9rem; line-height: 1.45; }
.key-badge { font-style: normal; color: var(--accent); font-size: .9rem; line-height: 1; }

/* Education */
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
@media (max-width: 760px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
.two-col .section-title { font-size: clamp(1.6rem, 3vw, 2.1rem); margin-bottom: 1rem; }
.edu-degree { font-weight: 700; font-size: 1.1rem; }
.edu-meta { color: var(--muted); }
.plain-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: .75rem; }

/* Contact */
.contact { margin-top: clamp(3.5rem, 8vw, 6rem); background: #1c1b19; color: #f1ede6; padding: clamp(3.5rem, 9vw, 6.5rem) 0; }
.contact-inner { display: flex; flex-direction: column; gap: 1.4rem; }
.contact-title { font-family: var(--display); font-weight: 600; font-size: clamp(2.3rem, 6vw, 4.4rem); letter-spacing: -0.035em; line-height: 1; max-width: 16ch; }
.contact-time { font: 600 .82rem/1 var(--body); color: #e8795a; text-transform: uppercase; letter-spacing: .12em; }
.contact-email { font-family: var(--display); font-weight: 500; font-size: clamp(1.2rem, 3vw, 1.85rem); color: #f1ede6; text-decoration: underline; text-decoration-color: #e8795a; text-underline-offset: .22em; text-decoration-thickness: 2px; overflow-wrap: anywhere; align-self: flex-start; }
.contact-email:hover { color: #e8795a; }
.contact .btn-primary { background: #f1ede6; color: #1c1b19; }
.contact .btn-primary:hover { background: #e8795a; color: #1c1b19; }
.contact .btn-ghost { background: transparent; color: #f1ede6; border-color: #57524b; }
.contact .btn-ghost:hover { border-color: #f1ede6; color: #f1ede6; }
.contact :focus-visible { outline-color: #e8795a; }
.contact-note { color: #f1ede6; opacity: .75; }

.footer { padding-top: 1.5rem; padding-bottom: 2rem; color: var(--muted); font-size: .9rem; display: flex; flex-direction: column; gap: .75rem; }
.legal { display: flex; flex-direction: column; gap: .25rem; max-width: 46rem; }
.legal summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--ink); }
.legal p { padding-bottom: .75rem; }

/* Skeleton */
.space-stage.is-loading::before { content: ""; position: absolute; inset: 1.5rem; background: var(--sk); border-radius: 12px; animation: sk-pulse 1.4s ease-in-out infinite; }
.sk { min-height: 100vh; }
.sk-bar { height: 64px; border-bottom: 1px solid var(--line); }
.sk-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(2rem, 5vw, 4rem); padding-top: clamp(2.5rem, 6vw, 5rem); }
@media (max-width: 980px) { .sk-hero { grid-template-columns: minmax(0, 1fr); } }
.sk-col { display: flex; flex-direction: column; gap: 1rem; }
.sk-line, .sk-panel { background: var(--sk); border-radius: 6px; animation: sk-pulse 1.4s ease-in-out infinite; }
.sk-line { height: 1rem; }
.sk-line.h-xl { height: clamp(3rem, 7vw, 5.4rem); }
.sk-panel { height: clamp(420px, 60vw, 640px); border-radius: 18px; }
.w40 { width: 40%; } .w50 { width: 50%; } .w60 { width: 60%; } .w80 { width: 80%; } .w90 { width: 90%; }

/* Boot loader */

#boot.done { opacity: 0; visibility: hidden; }
.boot-inner { width: min(34rem, 100%); display: flex; flex-direction: column; gap: 1.5rem; }
.boot-name { font-family: var(--display); font-weight: 700; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1; letter-spacing: -0.03em; color: var(--ink); min-height: 1em; }
.boot-cursor { display: inline-block; width: .07em; height: .85em; margin-left: .06em; background: var(--accent); vertical-align: -0.05em; animation: boot-blink 1s steps(1) infinite; }
.boot-term { font: 500 .92rem/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); list-style: none; padding: 0; margin: 0; min-height: 6.8em; }
.boot-term li { opacity: 0; transform: translateY(4px); transition: opacity .25s ease, transform .25s ease; }
.boot-term li.on { opacity: 1; transform: none; }
.boot-term .ok { color: var(--accent); font-weight: 700; margin-left: .4em; opacity: 0; transition: opacity .2s; }
.boot-term li.ok-on .ok { opacity: 1; }
.boot-term .p { color: var(--accent); margin-right: .5em; }
@keyframes boot-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .boot-cursor { animation: none; } .boot-term li, #boot { transition: none; } }
